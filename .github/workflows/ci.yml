# Rivect CI/CD — local §14 gate on Linux+macOS, tag-triggered package.
#
# Standards §14: actions are pinned by version tag here; before relying on
# this pipeline for a release, pin each `uses:` to its commit SHA
# (supply-chain hardening — tracked as release follow-up).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The full §14 local gate: fmt, clippy, workspace test, doc test,
  # rustdoc -Dwarnings, cargo deny, fetch --locked. Linux runner; the
  # sandbox_linux suite executes here under Landlock.
  gate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: fetch locked
        run: cargo fetch --locked
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: workspace tests
        # Doc-dependent gates need files the code-only checkout lacks
        # (origin carries no docs/pack trees): the stack-admission trio and
        # the measurement suite (frozen docs/release-budgets.md). Skip
        # exactly those and run everything else — never a blanket skip.
        run: >-
          cargo test --locked --workspace
          -- --skip the_stack_admission_inputs_are_present_and_accepted
          --skip always_on_instructions_keep_their_size_budget
          --skip every_denied_lint_stays_visible_to_agents
          --skip local_cache_is_not_a_provider_cache
          --skip missing_leg_is_not_pass
          --skip ineligible_p99_is_not_pass
          --skip frozen_release_budgets_match_the_pinned_digest
          --skip offline_corpus_measures_the_installed_candidate_against_the_frozen_limits
          --skip only_provider_rows_may_stay_not_run_with_their_prerequisite
          --skip unavailable_platform_is_not_pass
          --skip over_limit_fixture_is_blocked_not_pass
          --skip unmeasured_kit_or_owned_rss_is_not_pass
      - name: doc tests
        run: cargo test --locked --workspace --doc
      - name: rustdoc
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --workspace --no-deps
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # macOS leg: every carrier oracle lives in tests/sandbox_macos.rs under
  # Seatbelt; this runner is the only place those rows can ever PASS.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fetch locked
        run: cargo fetch --locked
      - name: sandbox macos suite (all carrier oracles)
        run: cargo test --locked --test sandbox_macos -- --nocapture
      - name: workspace tests
        # Doc-dependent gates need files the code-only checkout lacks; the
        # index-worker's proc-table oracles are Linux-only (their carrier is
        # gate-linux). Skips name the excluded rows exactly.
        run: >-
          cargo test --locked --workspace
          -- --skip the_stack_admission_inputs_are_present_and_accepted
          --skip always_on_instructions_keep_their_size_budget
          --skip every_denied_lint_stays_visible_to_agents
          --skip local_cache_is_not_a_provider_cache
          --skip missing_leg_is_not_pass
          --skip ineligible_p99_is_not_pass
          --skip frozen_release_budgets_match_the_pinned_digest
          --skip offline_corpus_measures_the_installed_candidate_against_the_frozen_limits
          --skip only_provider_rows_may_stay_not_run_with_their_prerequisite
          --skip unavailable_platform_is_not_pass
          --skip over_limit_fixture_is_blocked_not_pass
          --skip unmeasured_kit_or_owned_rss_is_not_pass
          --skip alive_observer_passes_only_the_allowlist
          --skip answer_cap_stop_kills_and_reaps_the_worker
          --skip cancel_stop_kills_and_reaps_the_worker
          --skip cancellation_reaches_the_worker_and_ends_the_run
          --skip footprint_stop_threshold_is_the_memory_budget

  # CD: tag pushes build the installed bundle via scripts/package-release.sh,
  # run the release gate (exit 0 = ready, 5 = not ready yet — recorded, never
  # silently passed), then attach the bundle tarball to a GitHub Release.
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate-linux, test-macos]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fetch locked
        run: cargo fetch --locked
      - name: jq (macos)
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null || brew install jq
      - name: package bundle
        run: sh scripts/package-release.sh "$PWD/bundle"
      - name: release gate (recorded, not forced)
        id: gate
        run: |
          set +e
          sh scripts/release-gate.sh --bundle "$PWD/bundle"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0|5) exit 0 ;;
            *) exit "$code" ;;
          esac
      - name: tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          tar -C "$PWD/bundle" -czf "rivect-${tag}-${{ matrix.target }}.tar.gz" rivect rivect-sandbox-helper rivect.manifest.json
          sha256sum "rivect-${tag}-${{ matrix.target }}.tar.gz" > "rivect-${tag}-${{ matrix.target }}.tar.gz.sha256" 2>/dev/null || \
            shasum -a 256 "rivect-${tag}-${{ matrix.target }}.tar.gz" > "rivect-${tag}-${{ matrix.target }}.tar.gz.sha256"
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rivect-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            rivect-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            rivect-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          retention-days: 30
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          # release_ready=false (gate exit 5) publishes a prerelease draft;
          # a real GO (exit 0) publishes the release for install.
          draft: ${{ steps.gate.outputs.exit != '0' }}
          prerelease: ${{ steps.gate.outputs.exit != '0' }}
          files: |
            rivect-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            rivect-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          body: |
            Install: untar `rivect-${{ github.ref_name }}-${{ matrix.target }}.tar.gz`
            and place `rivect` + `rivect-sandbox-helper` on PATH together.
            Verify `rivect.manifest.json` digests before use.
