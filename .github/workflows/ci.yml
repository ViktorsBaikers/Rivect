# Ownership and evidence contracts: docs/ci-cd.md.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A newer PR supersedes checks; a release must not be cancelled mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  RUST_TEST_THREADS: "2"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: quality
          save-if: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: >-
          cargo clippy --locked --workspace --all-targets --all-features
          -- -D warnings
      - run: RUSTDOCFLAGS="-Dwarnings" cargo doc --locked --workspace --no-deps
      - name: dependency policy (pinned, registry-verified tool)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny check
      - name: workflow and script contracts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sh -n install.sh
          shellcheck install.sh scripts/*.sh
          python3 scripts/ci-contract-tests.py
          python3 scripts/ci-tui-contract-tests.py
          python3 scripts/release-resources-test.py
          python3 scripts/eval-metrics-test.py
          python3 scripts/install-contract-tests.py

  test:
    name: test-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            platform: macos
            target: aarch64-apple-darwin
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: locate candidate outside the checkout
        run: |
          {
            echo "RIVECT_TEST_BUNDLE=$RUNNER_TEMP/candidate"
            echo "RIVECT_V2_TEST_BUNDLE=$RUNNER_TEMP/candidate"
          } >> "$GITHUB_ENV"
      - name: select native Apple Git for confined execution
        if: matrix.platform == 'macos'
        run: |
          git_bin=$(/usr/bin/xcrun --find git)
          test -x "$git_bin"
          shim_dir=$(mktemp -d "$RUNNER_TEMP/rivect-native-git.XXXXXX")
          ln -s "$git_bin" "$shim_dir/git"
          printf '%s\n' "$shim_dir" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-v2-${{ matrix.platform }}
          cache-bin: false
          save-if: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Linux sandbox and local credential-store prerequisites
        if: matrix.platform == 'linux'
        run: |
          sh scripts/ci-linux-prerequisites.sh
          sudo apt-get install -y -q --no-install-recommends \
            gnome-keyring dbus-daemon
      - name: verify release tag matches package version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "rivect") | .version')
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: build and verify the OpenTUI candidate
        working-directory: tui
        run: |
          bun install --frozen-lockfile --ignore-scripts --libc '*'
          node_modules/.bin/tsc
          bun build.ts
          sh ../scripts/package-release.sh "$RIVECT_TEST_BUNDLE"
          python3 ../scripts/check-release-sbom.py "$RIVECT_TEST_BUNDLE"
          "$RIVECT_TEST_BUNDLE/rivect" --version
          "$RIVECT_TEST_BUNDLE/rivect" --help
      - name: test OpenTUI wire and build the PTY screen reader
        timeout-minutes: 10
        run: |
          ln -s "$RIVECT_TEST_BUNDLE" tui/build/core
          (cd tui && bun test ./wire_test.ts ./actions_test.ts ./dock.test.ts)
          cargo build --offline --locked --example pty-screen
      - name: test the OpenTUI candidate
        timeout-minutes: 5
        run: |
          python3 scripts/ci-tui-test.py "$RIVECT_V2_TEST_BUNDLE"
      - name: verify MCP against independent SDK
        run: |
          npm ci --prefix tests/fixtures/mcp-sdk \
            --ignore-scripts --no-audit --no-fund
          cargo test --locked --offline --test mcp \
            official_sdk_stdio_contract -- --ignored --exact
      - name: test installed OpenTUI across upgrade and rollback in a PTY
        run: |
          cmp tui/build/rivect-tui "$RIVECT_V2_TEST_BUNDLE/libexec/rivect-tui"
          python3 scripts/install-contract-tests.py -v \
            InstallerContract.test_native_v2_activation
      - name: run platform targets once and attest their evidence
        run: |
          if [[ "$PLATFORM" == linux ]]; then
            dbus-run-session -- sh scripts/ci-platform-test.sh
          else
            sh scripts/ci-platform-test.sh
          fi
      - name: doc tests (not included in explicit target selection)
        run: cargo test --locked --workspace --doc
      - name: assemble tested candidate and evidence
        run: |
          mkdir -p transfer/target
          case "$PLATFORM" in
            macos) lib=libopentui.dylib ;; linux) lib=libopentui.so ;;
            *) exit 2 ;;
          esac
          export COPYFILE_DISABLE=1
          tar -C "$RIVECT_TEST_BUNDLE" -czf transfer/candidate.tar.gz \
            rivect rivect-sandbox-helper rivect.manifest.json \
            libexec/rivect-tui "libexec/$lib"
          cp xhost-receipt.json "$RIVECT_TEST_BUNDLE.cdx.json" \
            "$RIVECT_TEST_BUNDLE.manifest.sha256" transfer/
          cp target/provider-trials.json target/search-trials.json \
            target/acceptance-rows-*.json target/installed-ordinary.json \
            target/installed-tui-matrix.json transfer/target/
          cp -R target/rivect-not-run transfer/target/
      - name: measure resources of the exact v2 archive and installed kit
        if: >-
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main') ||
          startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 12
        run: |
          python3 scripts/release-resources.py collect "$RIVECT_TEST_BUNDLE" \
            transfer/candidate.tar.gz transfer/resources.json
      # upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xhost-${{ matrix.platform }}
          path: transfer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: retain diagnostics even on failure
        if: ${{ always() }}
        # upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            target/ci-logs/
            target/tui-ci-logs/
            target/rivect-not-run/
          retention-days: 7

  verify-release:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    needs: [quality, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            platform: macos
            target: aarch64-apple-darwin
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: locate candidate outside the checkout
        run: |
          echo "RIVECT_TEST_BUNDLE=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
      - name: select native Apple Git for confined execution
        if: matrix.platform == 'macos'
        run: |
          git_bin=$(/usr/bin/xcrun --find git)
          test -x "$git_bin"
          shim_dir=$(mktemp -d "$RUNNER_TEMP/rivect-native-git.XXXXXX")
          ln -s "$git_bin" "$shim_dir/git"
          printf '%s\n' "$shim_dir" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-v2-${{ matrix.platform }}
          cache-bin: false
          save-if: false
      # download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: xhost-*
          path: xhost
          digest-mismatch: error
      - name: verify receipts and restore the exact tested candidate
        run: |
          test "$(find xhost -name xhost-receipt.json | wc -l | tr -d ' ')" = 2
          mkdir "$RIVECT_TEST_BUNDLE"
          tar -xOf "xhost/xhost-$PLATFORM/candidate.tar.gz" \
            rivect.manifest.json > "$RIVECT_TEST_BUNDLE/rivect.manifest.json"
          sh scripts/xhost-bind.sh "$RIVECT_TEST_BUNDLE" "$GITHUB_SHA"
          host="xhost/xhost-$PLATFORM"
          tar -xf "$host/candidate.tar.gz" -C "$RIVECT_TEST_BUNDLE"
          for suffix in cdx.json manifest.sha256; do
            cp "$host/candidate.$suffix" "$RIVECT_TEST_BUNDLE.$suffix"
          done
          python3 scripts/check-release-sbom.py "$RIVECT_TEST_BUNDLE"
          cp -R "xhost/xhost-$PLATFORM/target/." target/
      - name: Linux sandbox prerequisite for the conjunction
        if: matrix.platform == 'linux'
        run: sh scripts/ci-linux-prerequisites.sh
      - name: release conjunction only (no producer reruns)
        run: |
          host="$PWD/xhost/xhost-$PLATFORM"
          export RIVECT_RELEASE_ARCHIVE="$host/candidate.tar.gz"
          export RIVECT_RELEASE_RESOURCES="$host/resources.json"
          code=0
          sh scripts/release-gate.sh --bundle "$RIVECT_TEST_BUNDLE" \
            --receipts-only || code=$?
          case "$code" in 0|5) ;; *) exit "$code" ;; esac
          jq -e '.resources_sha256 | strings | test("^[0-9a-f]{64}$")' \
            target/final-acceptance.json >/dev/null
          mkdir dist
          cp install.sh "dist/install-$TARGET.sh"
          installer=$(shasum -a 256 "dist/install-$TARGET.sh" | cut -d ' ' -f 1)
          sbom=$(shasum -a 256 "$RIVECT_TEST_BUNDLE.cdx.json" | cut -c1-64)
          archive=$(jq -er '.archive_sha256' "$RIVECT_RELEASE_RESOURCES")
          jq --argjson exit "$code" --arg target "$TARGET" \
            --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg installer "$installer" --arg sbom "$sbom" \
            --arg archive "$archive" \
            '. + {gate_exit:$exit, target:$target, commit:$commit, run_id:$run,
                  archive_sha256:$archive, sbom_sha256:$sbom,
                  installer_sha256:$installer}' \
            target/final-acceptance.json > "dist/report-$TARGET.json"
          base="dist/rivect-$GITHUB_REF_NAME-$TARGET"
          cp "$RIVECT_RELEASE_ARCHIVE" "$base.tar.gz"
          cp "$RIVECT_RELEASE_RESOURCES" "$base.resources.json"
          for suffix in cdx.json manifest.sha256; do
            cp "$RIVECT_TEST_BUNDLE.$suffix" "$base.$suffix"
          done
          (cd dist && shasum -a 256 ./*.tar.gz > "$TARGET.sha256")
      # upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout, Cargo, build script or test runs with a write token.
      # download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/rivect-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            dist/rivect-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
      - name: publish both platforms in one transaction owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          test "$(find . -name 'report-*.json' | wc -l | tr -d ' ')" = 2
          test "$(find . -name '*.cdx.json' | wc -l | tr -d ' ')" = 2
          test "$(find . -name '*.manifest.sha256' | wc -l)" -eq 2
          test "$(find . -name '*.resources.json' | wc -l)" -eq 2
          test "$(find . -name '*.tar.gz' | wc -l | tr -d ' ')" = 2
          assets=()
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            base="rivect-$GITHUB_REF_NAME-$target"
            archive=$(sha256sum "$base.tar.gz" | cut -c1-64)
            test "$(cat "$target.sha256")" = "$archive  ./$base.tar.gz"
            candidate=$(tar -xOf "$base.tar.gz" rivect.manifest.json \
              | sha256sum | cut -d ' ' -f 1)
            test "$(cat "$base.manifest.sha256")" = "$candidate"
            jq -e --arg hash "$candidate" 'any(.components[];
              .type == "file" and .name == "rivect.manifest.json" and
              .hashes == [{alg:"SHA-256", content:$hash}])' \
              "$base.cdx.json" >/dev/null
            sbom=$(sha256sum "$base.cdx.json" | cut -c1-64)
            resources=$(sha256sum "$base.resources.json" | cut -c1-64)
            assets+=("./$base.tar.gz" "./$base.cdx.json"
                     "./$base.manifest.sha256" "./$base.resources.json"
                     "./report-$target.json"
                     "./$target.sha256")
            test -f "install-$target.sh"
            test ! -L "install-$target.sh"
            installer=$(sha256sum "install-$target.sh" | cut -d ' ' -f 1)
            jq -e --arg target "$target" --arg commit "$GITHUB_SHA" \
              --arg run "$GITHUB_RUN_ID" --arg candidate "$candidate" \
              --arg installer "$installer" --arg sbom "$sbom" \
              --arg resources "$resources" --arg archive "$archive" '
              .schema_version == 1 and .target == $target and
              .commit == $commit and .run_id == $run and
              .candidate_manifest_sha256 == $candidate and
              .installer_sha256 == $installer and .sbom_sha256 == $sbom and
              .resources_sha256 == $resources and
              .archive_sha256 == $archive and
              (.release_ready | type == "boolean") and
              (.blockers.retained_legs |
                type == "number" and . >= 0 and . == floor) and
              ((.gate_exit == 0 and .release_ready == true and
                .blockers.retained_legs == 0) or
               (.gate_exit == 5 and (.release_ready == false or
                .blockers.retained_legs > 0)))
            ' "report-$target.json"
          done
          cmp install-x86_64-unknown-linux-gnu.sh install-aarch64-apple-darwin.sh
          cp install-x86_64-unknown-linux-gnu.sh install.sh
          sha256sum install.sh > install.sh.sha256
          verify_tag() {
            local tag_sha
            tag_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
            test "$tag_sha" = "$GITHUB_SHA"
          }
          verify_tag
          args=(--draft)
          ready=true
          if ! jq -se 'all(.[]; .gate_exit == 0 and .release_ready == true
            and .blockers.retained_legs == 0)' ./report-*.json; then
            args+=(--prerelease)
            ready=false
          fi
          # Draft first: failed uploads cannot expose a partial release.
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Rivect $GITHUB_REF_NAME" \
            --notes 'Install with: curl -fsSL https://github.com/ViktorsBaikers/Rivect/releases/latest/download/install.sh | sh' \
            "${args[@]}" "${assets[@]}" ./install.sh.sha256 install.sh
          if [[ "$ready" == true ]]; then
            verify_tag
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
