[package]
name = "rivect"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace]
members = [".", "crates/rivect-sandbox-helper"]
resolver = "3"

# DEC-009/DEC-018: the confined helper binary (unsafe allowed only in
# crates/rivect-sandbox-helper) — the workspace forbid/deny lint tables of
# this package do not reach it. Per-target lint tables are not a cargo
# feature (cargo rejects `[lints.example.<name>]`); the helper crate owns
# its own
# [lints] instead: unsafe_code allow, dead_code warn,
# unused_qualifications warn, trivial_casts warn,
# variant_size_differences warn, unwrap_used deny, expect_used deny,
# panic deny, todo deny, unimplemented deny, dbg_macro deny,
# mem_forget deny, undocumented_unsafe_blocks deny, map_err_ignore
# deny, let_underscore_must_use deny, allow_attributes_without_reason
# warn.

# Engineering standards §14 (docs/engineering-standards.md): denied patterns are
# enforced here so the gate fails at compile time regardless of which tool or
# agent produced the code. Local re-allow of these lints is itself caught by
# tests/code_conventions.rs.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny" # unicode-confusable identifiers (supply-chain surface)
dead_code = "warn" # explicit so the ratchet may ban `#[allow(dead_code)]` (§3.3)
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn" # enum memory footprint
unexpected_cfgs = "warn"          # cfg name typos (check-cfg)
let_underscore_drop = "warn"      # `let _ = guard` drops immediately — usually a bug
elided_lifetimes_in_paths = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
map_err_ignore = "deny"          # `map_err(|_| …)` discards the cause (§4)
let_underscore_must_use = "deny" # `let _ = must_use` swallows results (§2.2)
let_underscore_future = "deny"   # dropped future = detached task (§5.1)
arc_with_non_send_sync = "deny"  # Arc over !Send/!Sync — soundness hazard
unused_async = "deny"            # async fn that never awaits — fake async
allow_attributes_without_reason = "warn"
await_holding_lock = "warn"
# Concurrency & determinism — the load path must not hide ordering hazards.
iter_over_hash_type = "warn"             # HashMap/HashSet iteration order is unstable
significant_drop_tightening = "warn"     # guards held longer than needed
significant_drop_in_scrutinee = "warn"   # guard alive inside if/match scrutinee
large_futures = "warn"                   # fat futures hurt poll latency (§5)
mutex_atomic = "warn"
mutex_integer = "warn"
# Allocation & conversion hygiene (§3.3, §6).
checked_conversions = "warn"     # `as` where try_from exists — rusqlite i64↔u64 edge
redundant_clone = "warn"
unnecessary_to_owned = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
format_collect = "warn"
stable_sort_primitive = "warn"
verbose_file_reads = "warn"
option_option = "warn"
fallible_impl_from = "warn"      # From impls that can panic — must be TryFrom
# API & structure hygiene (§3).
manual_let_else = "warn"
redundant_pub_crate = "warn"
unnecessary_wraps = "warn"
wildcard_imports = "warn"
struct_excessive_bools = "warn"  # boolean state → proper state machine (§8 unhappy)
fn_params_excessive_bools = "warn"
excessive_nesting = "warn"       # threshold is a ratchet, see clippy.toml
cognitive_complexity = "warn"    # threshold is a ratchet, see clippy.toml

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "warn"
bare_urls = "warn"
private_intra_doc_links = "warn"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std"] }
rivect-sandbox-helper = { path = "crates/rivect-sandbox-helper", version = "0.1.0" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml_edit = "0.25.13"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4"] }
unicode-normalization = "0.1.25"
focaccia = "2.1.0"
# SRC-010: scoped credential profiles on native secret stores — keyring-core
# supplies the Entry/CredentialStore seam; the platform store crates are the
# explicit backends (no `keyring` wrapper crate per its own guidance).
keyring-core = "1.0.0"
# SRC-003: synchronous HTTP for provider dialects — the Provider seam is
# blocking, so `blocking` only; no product async code is authored —
# tokio appears only inside reqwest's blocking client and the
# dev-dependency harness. The platform
# TLS provider (`native-tls`) is the license-clean choice — reqwest's
# `rustls` feature drags CDLA-2.0 `webpki-root-certs` into the resolved
# graph, which deny.toml rejects; `json` is the wire codec. Redirects
# stay off — egress is exactly the configured endpoint.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# `keychain` feature = the legacy-file keychain store (SRC-010 records the
# feature name); the crate ships no default features.
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Exactly one rt/crypto feature is required; SRC-010 pins rt-tokio-crypto-rust.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"
# Offline provider proof: wiremock serves the recorded Responses/SSE
# fixtures on localhost; tokio supplies only the test runtime wiremock
# needs — the product itself stays synchronous.
tokio = { version = "1.53.1", features = ["macros", "rt"] }
wiremock = "0.6.5"
