[package]
name = "rivect"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml_edit = "0.25.13"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
portable-pty = "0.9.0"
proptest = "1.11.0"
vt100 = "0.16.2"
wiremock = "0.6.5"
