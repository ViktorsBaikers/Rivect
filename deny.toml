# cargo-deny configuration (SRC-020, research/stack-selection.md §Dev tooling).
# `cargo deny check` runs as part of source admission and the release gate;
# the advisory DB is fetched/owned by root at check time, not by builds.

[graph]
all-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BlueOak-1.0.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# P-001/P-002 (docs/engineering-standards.md §4, §9): owner-local thiserror
# errors only, rusqlite is the only SQL stack. Mechanical enforcement — these
# crates can never enter the dependency tree.
deny = [
    # anyhow may only arrive via the portable-pty dev-dependency (test PTY
    # harness); it can never be a direct dep — owner APIs use thiserror enums.
    { name = "anyhow", wrappers = ["portable-pty"] },
    { name = "eyre" },
    { name = "diesel" },
    { name = "sqlx" },
    { name = "sea-orm" },
    { name = "sea-query" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
# Scopes: "workspace" denies unmaintained/unsound crates reachable from
# workspace deps — abandoned or unsound deps surface at admission time.
unsound = "workspace"
unmaintained = "workspace"
yanked = "deny"
ignore = []
